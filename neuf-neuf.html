<style>
  :root {
    --orange:#e8591a; --orange-pale:#fdeee6; --sable:#f6ab52; --bleu:#1f2fa8;

  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {

  }
  .page { width:100%; max-width:460px; min-height:100vh; background:var(--blanc); display:flex; flex-direction:column; }

  .hero { position:relative; background:var(--orange); padding:56px 20px 60px; text-align:center; }

  .logo {
    font-weight:900; font-style:italic; color:var(--bleu); line-height:1; letter-spacing:.03em;
    font-size:clamp(2rem,10.5vw,3.3rem); white-space:nowrap;
    -webkit-text-stroke:6px var(--blanc); paint-order:stroke fill;
  }
  .slogan {
    margin-top:18px; font-size:clamp(1rem,4.6vw,1.2rem); font-weight:700; font-style:italic; color:var(--blanc);
  }

  main { padding:28px 22px 12px; flex:1; }
  .liste { border:1px solid var(--trait); border-radius:14px; overflow:hidden; }
  .ligne { display:flex; align-items:center; gap:16px; padding:16px 18px; text-decoration:none; color:inherit; background:var(--blanc); }
  .ligne + .ligne { border-top:1px solid var(--trait); }
  .ligne:active { background:var(--fond); }
  .pastille { flex:none; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:var(--orange-pale); color:var(--orange); }
  .texte { flex:1; min-width:0; }
  .texte small { display:block; font-size:.82rem; color:var(--gris); margin-bottom:2px; }
  .texte strong { display:block; font-size:1.08rem; font-weight:600; letter-spacing:.01em; }
  svg { display:block; }
  .chev { flex:none; color:#b3b7c9; }

  .principal {
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:16px;
    padding:17px 20px; border-radius:12px; text-decoration:none;
    background:var(--bleu); color:var(--blanc); font-size:1.05rem; font-weight:650;
  }
  .principal:active { background:#18258a; }

  footer { padding:18px 22px 26px; text-align:center; font-size:.82rem; color:var(--gris); }
  footer a { color:var(--orange); font-weight:600; text-decoration:none; }

  a:focus-visible { outline:3px solid var(--sable); outline-offset:2px; }
  @media (min-width:520px) {
    body { padding:32px 0; background:#e9ebf3; }
    .page { min-height:0; border-radius:22px; overflow:hidden; box-shadow:0 18px 50px rgba(20,24,58,.18); }
  }
</style>
